name: Daily news

# Regenerates the small over-the-air articles slice (~74 KB) that the CantoReader
# app fetches on launch, and commits it straight into THIS repo.
#
# Why it lives here rather than in the app repo: this repo is PUBLIC, so GitHub
# Actions minutes are free and unmetered — the app repo is private, where they
# are billed. Running here also means the publish step pushes to its own repo
# using the automatic GITHUB_TOKEN, so no cross-repo write PAT is needed.
#
# Requires two repo secrets on THIS repo:
#   ANTHROPIC_API_KEY  — Claude API key for the graded rewrites
#   APP_REPO_TOKEN     — a fine-grained PAT with contents:READ on
#                        Hon-Luu/cantoreader-app (the private repo holding
#                        build_reader.py and the linguistic pipeline)
#
# The static character/word data is NOT touched here; it ships bundled in the
# app and only changes on a rebuild.

on:
  schedule:
    # 21:30 HKT (13:30 UTC) — the END of the HK news day, so the morning
    # read draws on a full day of journalism. The old 06:00 HKT slot caught
    # RTHK mid-graveyard-shift and served heat advisories and burst water
    # mains as the day's two stories.
    - cron: "30 13 * * *"
    # Safety net ~2h later. GitHub silently dropped the 08-06 run
    # ("job was not acquired by Runner") and the day had no news. The
    # retry exists for DROPPED runs only: once today's slice is already
    # committed it exits early (see the guard below) instead of re-billing
    # a second rewrite for a possibly-different front-page pick — which is
    # exactly what happened twice on 2026-08-10.
    - cron: "30 15 * * *"
  workflow_dispatch:           # allow a manual run from the Actions tab

concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write              # commit articles.json back into this repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # This repo first: actions/checkout cleans the workspace root, so the
      # app checkout below must come after or it would be wiped.
      - name: Check out this data repo
        uses: actions/checkout@v4

      - name: Check out the app repo (private, read-only)
        uses: actions/checkout@v4
        with:
          repository: Hon-Luu/cantoreader-app
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the articles slice
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: app
        run: |
          echo "publish=false" >> "$GITHUB_OUTPUT"
          # Safety-net skip: if today's slice is already on main, the 23:30
          # retry has nothing to rescue. Scheduled runs only — a manual
          # dispatch should always regenerate. Best-effort under the shallow
          # checkout (if HEAD isn't an articles commit the date reads empty
          # and we just fall through to a regenerate; the "No change" branch
          # of the commit step keeps that harmless).
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ "$(git -C .. log -1 --format=%cs -- articles.json)" = "$(date -u +%F)" ]; then
            echo "Already published today — safety-net run not needed."
            exit 0
          fi
          # Seed the rolling news archive from the last published run. Each
          # night starts from a fresh checkout, so without this hand-off the
          # 14-day window would reset to just tonight's two stories.
          mkdir -p data
          cp ../news_archive.json data/news_archive.json 2>/dev/null || true
          # Sonnet for the daily rewrites: ~1/5 the price of Opus, and the
          # graded-ladder output validated cleanly (smoke-tested 2026-08-09).
          python3 build_reader.py --daily --model claude-sonnet-5 --articles-out articles.json
          # Off days (Tue/Thu/Sat/Sun) generate nothing BY DESIGN — build_reader
          # exits clean without writing articles.json, and that must end the
          # job green with no commit. (An unconditional `test -s` here failed
          # every off-day run 2026-08-09→08-11 and mailed failures for a
          # working schedule.) A severe-weather override still publishes on
          # any day — build_reader decides, so the fetch above always runs.
          if [ ! -s articles.json ]; then
            echo "Off day — nothing generated, nothing to publish."
            exit 0
          fi
          python3 -c "import json; d=json.load(open('articles.json')); assert d['articles'], 'empty'; print(len(d['articles']), 'articles', d['generated_at'])"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Commit the slice
        if: steps.gen.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cp app/articles.json articles.json
          cp app/data/news_archive.json news_archive.json
          rm -rf app
          git config user.name "cantoreader-bot"
          git config user.email "actions@users.noreply.github.com"
          # Generation takes minutes, and main can move underneath us in that
          # window (a code push, or the safety-net run) — which rejected the
          # push and lost a whole day's generated articles on 2026-08-06.
          # Rebase our data on top of whatever landed, and retry.
          published=0
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --mixed FETCH_HEAD          # keep our files, move HEAD
            git add articles.json news_archive.json
            if git diff --cached --quiet; then
              echo "No change — nothing to publish."
              published=1
              break
            fi
            git commit -m "Daily articles $(date -u +%F)"
            if git push origin HEAD:main; then
              echo "Published updated articles.json."
              published=1
              break
            fi
            echo "Push rejected (main moved) — retrying, attempt $attempt."
            git reset --soft HEAD~1
            sleep 5
          done
          [ "$published" = "1" ]
